name: بناء واختبار تطبيق أندرويد

on:
  workflow_dispatch:
  push:
    branches: ["main", "v2-professional-rebuild"]
  pull_request:

permissions:
  contents: read

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: تنزيل ملفات المشروع
        uses: actions/checkout@v4

      - name: إعداد Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: إعداد Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: اختبارات الوحدة وفحص Android Lint وبناء APK
        env:
          NOURADINE_API_BASE_URL: ${{ vars.NOURADINE_API_BASE_URL }}
        run: gradle --no-daemon testDebugUnitTest lintDebug assembleDebug -PnouradineApiBaseUrl="$NOURADINE_API_BASE_URL"

      - name: حفظ تقارير الاختبار والفحص
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Nouradine-Agriculture-test-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

      - name: حفظ ملف APK
        uses: actions/upload-artifact@v4
        with:
          name: Nouradine-Agriculture-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  verify-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install backend dependencies
        run: npm install --ignore-scripts
      - name: Check backend syntax
        run: npm run check
