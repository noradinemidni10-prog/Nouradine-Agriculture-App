name: بناء واختبار تطبيق أندرويد

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: تنزيل ملفات المشروع
        uses: actions/checkout@v4

      - name: إعداد Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: إعداد Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: اختبارات الوحدة وفحص Android Lint وبناء APK
        run: gradle --no-daemon testDebugUnitTest lintDebug assembleDebug

      - name: حفظ تقارير الاختبار والفحص
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Nouradine-Agriculture-test-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

      - name: حفظ ملف APK
        uses: actions/upload-artifact@v4
        with:
          name: Nouradine-Agriculture-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
